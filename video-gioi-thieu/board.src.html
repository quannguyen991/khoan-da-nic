<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Khoan Đã — video frame board</title>
<style>
:root{
  --paper:#f9f7ff; --paper-mid:#f4eeff; --paper-deep:#ebe2ff;
  --ink:#141032; --ink-2:#424064; --accent:#723fd9; --accent-hi:#b99bff; --soft:#ece1ff;
  --night:#141032; --night-lift:#301f66;
  --danger:#a50013; --warning:#794e00; --success:#005e31;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0}
html{background:#0e0b1f}
body{font-family:"Inter","Segoe UI",system-ui,-apple-system,sans-serif;color:#e9e4ff;padding:0 0 120px}
header.top{position:sticky;top:0;z-index:20;background:rgba(14,11,31,.92);border-bottom:1px solid #2b2457;padding:14px 28px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
header.top h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
header.top p{font-size:14px;color:#a79fd6;flex:1;min-width:260px}
button{font:inherit;cursor:pointer}
.btn{background:#723fd9;color:#fff;border:0;border-radius:999px;padding:12px 22px;font-weight:600;font-size:15px;min-height:48px}
.btn.ghost{background:transparent;border:1.5px solid #4a3f96;color:#d9cfff}
main{max-width:1280px;margin:0 auto;padding:28px 24px;display:grid;gap:56px}
.frame{display:grid;gap:14px}
.fh{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.fh .no{font-weight:800;font-size:15px;color:#b99bff}
.fh .tc{font-size:14px;color:#a79fd6}
.fh h2{font-size:20px;font-weight:700;flex:1;letter-spacing:-.01em}
.stage{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:14px;background:#000;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.cv{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;font-family:inherit}
.meta{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;font-size:14px;line-height:1.5;color:#c8c0ee}
.meta h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#8f85cf;margin-bottom:6px}
.meta .vo{font-size:15px;color:#efeaff}
.meta ul{padding-left:18px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;margin-right:6px}
.tag.real{background:#143d2a;color:#7be3ac}
.tag.built{background:#2a2160;color:#c9b8ff}
.tag.flow{background:#3a1f4d;color:#f1b8ff}
.tag.fix{background:#4a2410;color:#ffbd8a}
@media(max-width:820px){.meta{grid-template-columns:1fr}}

/* ---------- inside the stage (1920×1080) ---------- */
.plate{position:absolute;inset:0;background-size:cover;background-position:center}
.t{font-weight:700;font-size:108px;line-height:1.08;letter-spacing:-.02em}
.t2{font-weight:600;font-size:56px;line-height:1.2;letter-spacing:-.01em}
.p{font-weight:500;font-size:38px;line-height:1.35}
.hl{color:var(--accent)} .hlw{color:var(--accent-hi)}
.pop{opacity:0;transform:translateY(34px);transition:opacity .55s var(--ease),transform .7s var(--ease)}
.pop.on{opacity:1;transform:none}
.fade{opacity:0;transition:opacity .6s ease} .fade.on{opacity:1}
.caret.on::after{content:"";display:inline-block;width:.07em;height:.9em;margin-left:.06em;background:currentColor;vertical-align:-.08em;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.abs{position:absolute}
.cap{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);max-width:1500px;padding:14px 30px;background:rgba(20,16,50,.74);color:#fff;font-size:34px;font-weight:600;line-height:1.3;border-radius:14px;text-align:center;opacity:0;transition:opacity .35s}
.cap.on{opacity:1}
.chip{display:inline-flex;align-items:center;gap:16px;background:#fff;color:var(--ink);border-radius:999px;padding:18px 34px 18px 22px;font-size:38px;font-weight:600;box-shadow:0 12px 34px rgba(114,63,217,.22)}
.chip svg{flex:none}

/* phone (flat, never tilted) */
.phone{position:absolute;width:470px;border:14px solid #141032;border-radius:64px;overflow:hidden;background:#fff;box-shadow:0 40px 90px rgba(20,16,50,.32)}
.screen{position:relative;aspect-ratio:375/812;overflow:hidden}
.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}
.screen img.on{opacity:1}
.cur{position:absolute;width:92px;height:92px;transition:left .8s var(--ease),top .8s var(--ease);z-index:5;filter:drop-shadow(0 8px 14px rgba(20,16,50,.35))}
.tapc{position:absolute;width:120px;height:120px;border-radius:50%;border:6px solid var(--accent);opacity:0;transform:translate(-50%,-50%) scale(.3);z-index:4}
.tapc.on{animation:tapping .7s ease-out forwards}
@keyframes tapping{0%{opacity:.9;transform:translate(-50%,-50%) scale(.3)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}
.ring{transform-box:fill-box;transform-origin:center;opacity:0}
.ring.on{animation:ping 2.6s cubic-bezier(.2,.6,.3,1) forwards}
@keyframes ping{0%{opacity:.6;transform:scale(.15)}100%{opacity:0;transform:scale(2.8)}}
.dot{width:26px;height:26px;border-radius:50%;background:rgba(114,63,217,.22);transition:background .3s,transform .4s var(--ease)}
.dot.on{background:var(--accent);transform:scale(1.25)}
.card{background:#1f1850;border:2px solid #3b2f7a;border-radius:28px}
.pill{display:inline-block;border-radius:999px;font-weight:700;font-size:44px;padding:22px 48px;letter-spacing:-.01em}
.strike{position:absolute;height:10px;background:var(--accent);border-radius:6px;transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.strike.on{transform:scaleX(1)}
.row{display:flex;align-items:center;gap:26px;padding:22px 0;border-bottom:2px solid rgba(20,16,50,.12)}
.row b{font-size:34px;color:var(--accent);min-width:150px}
.row span{font-size:42px;font-weight:600}
.bar{position:absolute;bottom:0;width:100px;background:linear-gradient(180deg,#9b6dff,#723fd9);border-radius:18px 18px 0 0;height:0;transition:height 1s var(--ease)}
.swt{width:150px;height:76px;border-radius:999px;background:#3b2f7a;position:relative;transition:background .4s}
.swt i{position:absolute;left:8px;top:8px;width:60px;height:60px;border-radius:50%;background:#fff;transition:left .4s var(--ease)}
.swt.on{background:#7be3ac} .swt.on i{left:82px}
.swt.off{background:#6b6592}
@media (prefers-reduced-motion:reduce){.pop,.fade,.cur,.strike{transition:none}}
</style>
</head>
<body>
<header class="top">
  <h1>Khoan Đã — video frame board</h1>
  <p>14 frames · 16:9 · English · ~120 s. Flat 2D, real app screens, no people, no 3D. Frames play when scrolled into view.</p>
  <button class="btn" id="playAll">▶ Play all</button>
  <button class="btn ghost" id="stopAll">Stop</button>
</header>
<main id="board"></main>

<script>
/* ===== frame data: VO, sources, notes ===== */
const FR = [
 {no:'F01',tc:'0:00–0:06',name:'Hook — the call',
  vo:'It starts with a phone call. “We are the police. Your account is linked to a crime. Do not hang up. Do not tell your family.”',
  src:[['flow','plate-dark-1 (Flow)'],['built','typed lines + ringing pulses']],
  notes:['Scam script is generic and quoted as speech — no person is accused.','Opens on the problem, not the logo.']},
 {no:'F02',tc:'0:06–0:16',name:'Problem — two numbers',
  vo:'In Vietnam, impersonating the police is the most common phone scam. Over six thousand billion dong lost in eleven months of 2025 — and only a third of victims report it.',
  src:[['flow','plate-ripple-2 (Flow)'],['built','count-up + ring chart']],
  notes:['6,000+ bn VND: Ministry of Public Security, 11 months 2025 (checked 24 Sep). 32% report: NCA survey, 60,300 people, Dec 2025 (checked).','“Most common” scam type: from the repo script — confirm its source before filming.']},
 {no:'F03',tc:'0:16–0:24',name:'The gap — 60 seconds',
  vo:'Older people are not uninformed. They are short of sixty seconds — and someone to ask.',
  src:[['flow','plate-ripple-1 (Flow)'],['built','strike-through + ring timer']],
  notes:['Thesis of the product: attack the “stay on the line, tell no one” step.','Never blames the user (§11).']},
 {no:'F04',tc:'0:24–0:30',name:'Reveal — Khoan Đã',
  vo:'This is Khoan Đã — Vietnamese for “hold on”. Pause. Verify. Protect.',
  src:[['flow','plate-light-1 (Flow)'],['built','pause bars → logo'],['real','assets/logo-512.png']],
  notes:['Logo is the project’s own file; the bars are drawn, the logo is never redrawn.']},
 {no:'F05',tc:'0:30–0:40',name:'One question, three taps',
  vo:'A person on a call cannot type. So the app asks one question: what are you being asked to do? Three taps, no typing.',
  src:[['real','screens 01 · 02 · 03 · 04'],['flow','plate-light-2 (Flow)']],
  notes:['English copy “What are you being asked to do?” is the mandated line.','Re-capture at 3× pixel ratio before rendering (current shots are 375×812).']},
 {no:'F06',tc:'0:40–0:52',name:'Result + what it could NOT check',
  vo:'The answer: high risk, hang up now. And right below, at the same size, what it could not check. Unchecked never means fine.',
  src:[['real','screens 05 · 06'],['flow','plate-light-1 (Flow)']],
  notes:['Core safety idea (§4.3): the unchecked box matches the verdict in size.','Shows “No AI read the content this time” — true for the tap flow.']},
 {no:'F07',tc:'0:52–1:00',name:'Pause for 60 seconds',
  vo:'If fear takes over: a sixty second pause, and one sentence to say. “Let me ask my family and call you back.”',
  src:[['real','screen 07'],['flow','plate-urgent-1 (Flow)']],
  notes:['Single red shot — keep it short.','Screen 07 shows “Call Emergency 911” (US profile). For a Vietnam story capture with the Vietnam profile (113) or crop it out.']},
 {no:'F08',tc:'1:00–1:18',name:'Technology — witness and judge',
  vo:'Here is the technology. AI reads the message and raises flags, but it has no field to give a risk score. A fixed rule engine decides, so the same input always gives the same answer. If the AI is down, the rule layer still runs.',
  src:[['flow','plate-dark-1 (Flow)'],['built','flat diagram — all vector']],
  notes:['58 signals · 10 critical combinations: from the rule engine contract (CLAUDE.md).','Signals are “present | unknown” only; schema rejects riskScore / riskLabel.','Claim is “rules still run”, not “same accuracy without AI”.']},
 {no:'F09',tc:'1:18–1:26',name:'Three labels, nothing else',
  vo:'Three labels only. High risk. Suspicious. No clear risk signals found. Never a fourth.',
  src:[['real','screen 09 (history)'],['flow','plate-light-2 (Flow)'],['built','label pills']],
  notes:['Exact strings from src/risk-labels. The word “safe” never appears, even crossed out.','Clear the history before filming — it holds test entries.']},
 {no:'F10',tc:'1:26–1:36',name:'Around the pause',
  vo:'Around that pause: family one tap away, official bank numbers with their source and date, and a seventy-two hour watch after a transfer.',
  src:[['real','screens 10 · 11'],['built','72-hour bar (screen not captured yet)'],['flow','plate-ripple-1 (Flow)']],
  notes:['72-hour watch exists in the app (view theo_doi_72h) — capture the real screen, then replace the drawn bar.','English locale lists US/UK hotlines; use the Vietnam profile for the final capture.']},
 {no:'F11',tc:'1:36–1:46',name:'Expected outcomes',
  vo:'What we expect: more people pausing before the transfer. We will measure that in a pilot with older adults and their families.',
  src:[['flow','plate-mint-1 (Flow)'],['built','target chart + SDG rows']],
  notes:['Everything on this frame is a TARGET and says so — no measured claim.','SDG mapping is expected contribution, to validate in the pilot.']},
 {no:'F12',tc:'1:46–1:53',name:'Industry fit + lean by design',
  vo:'It protects savings and trust in digital banking, and gives banks a warning layer before the confirm button — with rules running first, so fewer AI calls.',
  src:[['flow','plate-light-2 (Flow)'],['built','generic confirm screen (not a real bank)']],
  notes:['“Fewer AI calls” is a design intent and is marked “not yet measured”.','The confirm screen is a concept sketch, labelled as such.']},
 {no:'F13',tc:'1:53–2:00',name:'Honest numbers',
  vo:'Our test set has five hundred seventy-one messages we wrote ourselves, and no real victim messages yet. That is our next step.',
  src:[['flow','plate-dark-2 (Flow)'],['built','count-up']],
  notes:['92.1% / 1.8% come from eval/results/latest.json (24 Sep 2026, rules v1.6.1). The repo is now on rules 1.6.4 — re-run the eval before filming.','Real victim samples: 0 (latest.json).']},
 {no:'F14',tc:'2:00',name:'End card',
  vo:'Khoan Đã. Pause. Verify. Protect.',
  src:[['flow','plate-light-1 (Flow)'],['real','assets/logo-512.png']],
  notes:['Mark lands once, centred, held 3 s. URL from PRODUCT.md.']}
];

/* ===== helpers inside each stage ===== */
const SHIELD = '<svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="#b25400" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.3" r=".6" fill="#b25400"/></svg>';
const CURSOR = '<svg class="cur" viewBox="0 0 24 24"><path d="M4 2.5v17l4.6-4.2 3.2 6.6 2.8-1.4-3.1-6.3 6.3-.2z" fill="#141032" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>';
const BARS = (id,w)=>`<svg id="${id}" width="${w}" height="${w}" viewBox="0 0 320 320"><defs><linearGradient id="g${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b99bff"/><stop offset="1" stop-color="#723fd9"/></linearGradient></defs><rect x="62" y="52" width="78" height="216" rx="39" fill="url(#g${id})"/><rect x="180" y="52" width="78" height="216" rx="39" fill="url(#g${id})"/></svg>`;

/* ===== scenes ===== */
const SC = [
/* F01 */ {dur:6500, tpl:`
 <div class="plate" style="background-image:url(flow/plate-dark-1.jpg)"></div>
 <svg class="abs" style="left:0;top:0" width="1920" height="1080" viewBox="0 0 1920 1080">
   <circle class="ring" id="r1" cx="1600" cy="880" r="330" fill="none" stroke="#b99bff" stroke-width="5"/>
   <circle class="ring" id="r2" cx="1600" cy="880" r="330" fill="none" stroke="#b99bff" stroke-width="5"/>
   <circle class="ring" id="r3" cx="1600" cy="880" r="330" fill="none" stroke="#b99bff" stroke-width="5"/>
 </svg>
 <div class="abs fade" id="call" style="left:140px;top:120px;display:flex;align-items:center;gap:20px;background:#fff;color:#141032;border-radius:999px;padding:18px 36px 18px 20px;font-size:36px;font-weight:600">
   <span style="width:34px;height:34px;border-radius:50%;background:#d6203b;display:inline-block"></span>Unknown number · calling…</div>
 <div class="abs" style="left:140px;top:330px;color:#fff">
   <div class="t" id="a1" style="min-height:120px"></div>
   <div class="t" id="a2" style="min-height:120px"></div>
   <div class="t" id="a3" style="min-height:120px"></div>
   <div class="t hlw" id="a4" style="min-height:120px"></div>
 </div>
 <div class="cap" id="cap"></div>`,
 run(a){
  a.on('#call',100); a.on('#r1',300); a.on('#r2',1100); a.on('#r3',1900);
  a.cap('It starts with a phone call.',200);
  a.type('#a1','“This is the police.”',900,38);
  a.type('#a2','“Do not hang up.”',1900,38);
  a.type('#a3','“Tell no one.”',2700,38);
  a.type('#a4','Transfer now.',3500,45);
  a.cap('“Do not hang up. Do not tell your family.”',2400);
 }},
/* F02 */ {dur:8500, tpl:`
 <div class="plate" style="background-image:url(flow/plate-ripple-2.jpg)"></div>
 <div class="abs" style="left:130px;top:190px;color:#141032">
   <div class="fade" id="k1" style="font-size:40px;font-weight:600;color:#424064">Recorded losses · Jan–Nov 2025</div>
   <div id="n1" style="font-size:330px;font-weight:800;letter-spacing:-.045em;line-height:1">0</div>
   <div class="pop" id="u1" style="font-size:78px;font-weight:700;margin-top:6px"><span class="hl">billion VND</span></div>
   <div class="pop" id="s1" style="font-size:30px;color:#424064;margin-top:18px">Source: Ministry of Public Security</div>
 </div>
 <div class="abs" style="left:1180px;top:210px;width:600px;text-align:center;color:#141032">
   <svg width="520" height="520" viewBox="0 0 320 320" style="margin-left:40px">
     <circle cx="160" cy="160" r="130" fill="none" stroke="#e1d6ff" stroke-width="34"/>
     <circle id="arc" cx="160" cy="160" r="130" fill="none" stroke="#723fd9" stroke-width="34" stroke-linecap="round" transform="rotate(-90 160 160)" stroke-dasharray="816.8" stroke-dashoffset="816.8" style="transition:stroke-dashoffset 1.6s cubic-bezier(.16,1,.3,1)"/>
     <text id="n2" x="160" y="188" text-anchor="middle" font-size="96" font-weight="800" fill="#141032" font-family="Inter,Segoe UI,sans-serif">0%</text>
   </svg>
   <div class="pop" id="u2" style="font-size:56px;font-weight:700;line-height:1.15;margin-top:-6px">of victims <span class="hl">report it</span></div>
   <div class="pop" id="s2" style="font-size:30px;color:#424064;margin-top:14px">NCA survey · 60,300 people · Dec 2025</div>
 </div>
 <div class="cap" id="cap"></div>`,
 run(a){
  a.on('#k1',200); a.count('#n1',0,6000,400,1800,v=>Math.round(v).toLocaleString('en-US')+'+'); a.on('#u1',2000); a.on('#s1',2400);
  a.cap('Impersonating the police is the most common phone scam.',300);
  a.at(3200,()=>{a.$('#arc').setAttribute('stroke-dashoffset',816.8*(1-.32))});
  a.count('#n2',0,32,3200,1600,v=>Math.round(v)+'%'); a.on('#u2',4200); a.on('#s2',4700);
  a.cap('Only a third of victims report it.',3300);
 }},
/* F03 */ {dur:8000, tpl:`
 <div class="plate" style="background-image:url(flow/plate-ripple-1.jpg)"></div>
 <div class="abs" style="left:130px;top:230px;color:#141032;width:1100px">
   <div style="position:relative;display:inline-block">
     <div class="t pop" id="b1" style="font-size:80px;white-space:nowrap">They don’t lack knowledge.</div>
     <div class="strike" id="st" style="left:0;top:50px;width:100%"></div>
   </div>
   <div class="t pop" id="b2" style="margin-top:54px;font-size:150px">They lack<br><span class="hl">60 seconds</span></div>
   <div class="t2 pop" id="b3" style="margin-top:34px;color:#424064">— and someone to ask.</div>
 </div>
 <div class="abs pop" id="ringT" style="left:1260px;top:250px">
   <svg width="520" height="520" viewBox="0 0 320 320">
     <circle cx="160" cy="160" r="140" fill="none" stroke="#e1d6ff" stroke-width="22"/>
     <circle id="arc3" cx="160" cy="160" r="140" fill="none" stroke="#723fd9" stroke-width="22" stroke-linecap="round" transform="rotate(-90 160 160)" stroke-dasharray="879.6" stroke-dashoffset="0" style="transition:stroke-dashoffset 3.4s linear"/>
     <text id="n3" x="160" y="190" text-anchor="middle" font-size="120" font-weight="800" fill="#141032" font-family="Inter,Segoe UI,sans-serif">60</text>
   </svg>
 </div>
 <div class="cap" id="cap"></div>`,
 run(a){
  a.on('#b1',200); a.cap('Older people are not uninformed.',250);
  a.on('#st',1500); a.at(2100,()=>{a.$('#b1').style.opacity='.38'});
  a.on('#b2',2300); a.on('#ringT',2500); a.cap('They are short of sixty seconds…',2400);
  a.at(2900,()=>{a.$('#arc3').setAttribute('stroke-dashoffset',879.6)}); a.count('#n3',60,0,2900,3400,v=>Math.round(v));
  a.on('#b3',4200); a.cap('…and someone to ask.',4300);
 }},
/* F04 */ {dur:6500, tpl:`
 <div class="plate" style="background-image:url(flow/plate-light-1.jpg)"></div>
 <div class="abs" id="bw" style="left:760px;top:150px;transition:transform .9s var(--ease),opacity .6s;opacity:0;transform:translateY(40px)">${BARS('bars',400)}</div>
 <img class="abs fade" id="lg" src="assets/logo-512.png" style="left:760px;top:150px;width:400px;height:400px;border-radius:92px;transform:scale(.6);transition:opacity .5s,transform .9s var(--ease)">
 <div class="abs" style="left:0;width:1920px;top:610px;text-align:center;color:#141032">
   <div class="t" id="wm" style="font-size:132px;min-height:150px"></div>
   <div class="p" id="sub" style="color:#424064;min-height:54px"></div>
   <div class="t2 hl" id="tag" style="margin-top:26px;min-height:70px"></div>
 </div>
 <div class="cap" id="cap"></div>`,
 run(a){
  a.at(150,()=>{const e=a.$('#bw');e.style.opacity=1;e.style.transform='none'});
  a.at(1700,()=>{const e=a.$('#bw');e.style.opacity=0;e.style.transform='scale(.7)'; const l=a.$('#lg'); l.classList.add('on'); l.style.transform='scale(1)'});
  a.type('#wm','Khoan Đã',2300,70); a.type('#sub','Vietnamese for “hold on”',3200,28); a.type('#tag','Pause. Verify. Protect.',4200,45);
  a.cap('This is Khoan Đã — “hold on”.',2300);
 }},
/* F05 */ {dur:10500, tpl:`
 <div class="plate" style="background-image:url(flow/plate-light-2.jpg)"></div>
 <div class="abs" style="left:150px;top:210px;color:#141032;width:900px">
   <div class="t pop" id="c1"><span class="hl">One</span> question.</div>
   <div class="t2" id="c2" style="margin-top:34px;min-height:150px;color:#424064"></div>
   <div style="display:flex;gap:22px;margin-top:70px;align-items:center">
     <div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div>
     <div class="p fade" id="c3" style="margin-left:12px;font-weight:700">Three taps. No typing.</div>
   </div>
 </div>
 <div class="phone" style="left:1090px;top:42px"><div class="screen" id="scr">
   <img class="sw on" id="i1" src="screens/01-home-simple.jpg">
   <img class="sw" id="i2" src="screens/02-one-question.jpg">

   <div class="t2 hl" id="tag" style="margin-top:6px;min-height:70px"></div>
   <div class="p pop" id="url" style="margin-top:30px;color:#424064;font-weight:600">khoan-da.onrender.com</div>
 </div>
 <div class="cap" id="cap"></div>`,
 run(a){
  a.at(150,()=>{const e=a.$('#bw');e.style.opacity=1;e.style.transform='none'});
  a.at(1300,()=>{const e=a.$('#bw');e.style.opacity=0; const l=a.$('#lg'); l.classList.add('on'); l.style.transform='scale(1)'});
  a.type('#wm','Khoan Đã',1900,70); a.type('#tag','Pause. Verify. Protect.',2700,45); a.on('#url',4000);
  a.cap('Khoan Đã. Pause. Verify. Protect.',2000);
 }}
];

/* ===== engine ===== */
const board=document.getElementById('board');
const state=new Map();
FR.forEach((f,i)=>{
  const sec=document.createElement('section'); sec.className='frame'; sec.id=f.no;
  sec.innerHTML=`<div class="fh"><span class="no">${f.no}</span><span class="tc">${f.tc}</span><h2>${f.name}</h2><button class="btn ghost" data-i="${i}">↻ Replay</button></div>
  <div class="stage"><div class="cv"></div></div>
  <div class="meta"><div><h3>Voiceover (English)</h3><p class="vo">${f.vo}</p></div>
  <div><h3>Picture sources</h3><p>${f.src.map(s=>`<span class="tag ${s[0]}">${{real:'REAL',built:'BUILT',flow:'FLOW'}[s[0]]}</span>${s[1]}`).join('<br>')}</p>
  <h3 style="margin-top:10px">Notes</h3><ul>${f.notes.map(n=>`<li>${n}</li>`).join('')}</ul></div></div>`;
  board.appendChild(sec);
});
function fit(){document.querySelectorAll('.stage').forEach(s=>{s.querySelector('.cv').style.transform=`scale(${s.clientWidth/1920})`})}
addEventListener('resize',fit); fit();

function play(i,seek){
  const sec=document.getElementById(FR[i].no), cv=sec.querySelector('.cv'), sc=SC[i];
  const st=state.get(i); if(st) st.forEach(t=>{clearTimeout(t);clearInterval(t)});
  const timers=[]; state.set(i,timers);
  cv.innerHTML=sc.tpl; fit();
  const $=s=>cv.querySelector(s);
  const ops=[]; const add=(ms,run)=>ops.push({ms,run});
  const api={ $,
    at:(ms,fn)=>add(ms,()=>fn()),
    on:(s,ms)=>add(ms,()=>{const e=$(s); if(e) e.classList.add('on')}),
    show:(s,ms)=>add(ms,()=>{const e=$(s); if(!e) return; e.parentElement.querySelectorAll('.sw').forEach(x=>x.classList.remove('on')); e.classList.add('on')}),
    cap:(txt,ms)=>add(ms,()=>{const c=$('#cap'); if(!c) return; c.textContent=txt; c.classList.add('on')}),
    type:(s,txt,ms,per)=>add(ms,(sk)=>{const e=$(s); if(!e) return; e.classList.add('on');
      if(sk!=null){e.textContent=txt.slice(0,Math.max(0,Math.floor((sk-ms)/per))); return}
      e.classList.add('caret'); let k=0; const iv=setInterval(()=>{e.textContent=txt.slice(0,++k); if(k>=txt.length){clearInterval(iv); setTimeout(()=>e.classList.remove('caret'),500)}},per); timers.push(iv)}),
    count:(s,from,to,ms,dur,fmt)=>add(ms,(sk)=>{const e=$(s); if(!e) return;
      if(sk!=null){const p=Math.min(1,Math.max(0,(sk-ms)/dur)); e.textContent=fmt(from+(to-from)*(1-Math.pow(1-p,3))); return}
      const t0=performance.now(); const iv=setInterval(()=>{const p=Math.min(1,(performance.now()-t0)/dur); e.textContent=fmt(from+(to-from)*(1-Math.pow(1-p,3))); if(p>=1) clearInterval(iv)},30); timers.push(iv)})
  };
  sc.run(api);
  if(seek!=null) ops.filter(o=>o.ms<=seek).sort((x,y)=>x.ms-y.ms).forEach(o=>o.run(seek));
  else ops.forEach(o=>timers.push(setTimeout(()=>o.run(),o.ms)));
}
const seen=new Set();
const Q=new URLSearchParams(location.search);
const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){const id=e.target.closest('.frame').id; const i=FR.findIndex(f=>f.no===id); if(!seen.has(i)&&!playing){seen.add(i); play(i)}} }),{threshold:.5});
if(!Q.get('f')) document.querySelectorAll('.stage').forEach(s=>io.observe(s));
else { if(Q.get('still')){const sx=document.createElement('style'); sx.textContent='*{transition:none!important} .ring.on{animation:none!important;opacity:.0!important} .tapc.on{animation:none!important;opacity:0!important}'; document.head.appendChild(sx)} const id=Q.get('f'); document.querySelectorAll('.frame').forEach(s=>{s.style.display=s.id===id?'':'none'}); document.querySelector('header.top').style.display='none'; document.getElementById('board').style.padding='0'; fit(); play(FR.findIndex(f=>f.no===id), +(Q.get('t')||0)); }
board.addEventListener('click',e=>{const b=e.target.closest('button[data-i]'); if(b) play(+b.dataset.i)});

let playing=false, runId=0;
document.getElementById('playAll').onclick=async()=>{
  playing=true; const my=++runId;
  for(let i=0;i<FR.length&&playing&&my===runId;i++){
    document.getElementById(FR[i].no).querySelector('.stage').scrollIntoView({behavior:'smooth',block:'center'});
    await new Promise(r=>setTimeout(r,500)); if(!playing||my!==runId) break;
    play(i); await new Promise(r=>setTimeout(r,SC[i].dur+600));
  }
  playing=false;
};
document.getElementById('stopAll').onclick=()=>{playing=false;runId++};
</script>
</body>
</html>
