<div id="cap0" class="capcue"><span>It starts with a phone call.</span></div><div id="cap1" class="capcue"><span>“This is the police. Do not hang up. Tell no one.”</span></div><div id="cap2" class="capcue"><span>Over six thousand billion dong lost in eleven months of 2025.</span></div><div id="cap3" class="capcue"><span>And only a third of victims ever report it.</span></div><div id="cap4" class="capcue"><span>They don’t lack knowledge.</span></div><div id="cap5" class="capcue"><span>They lack sixty seconds — and someone to ask.</span></div><div id="cap6" class="capcue"><span>This is Khoan Đã.</span></div><div id="cap7" class="capcue"><span>Pause. Verify. Protect.</span></div><div id="cap8" class="capcue"><span>One screen. Four big buttons.</span></div><div id="cap9" class="capcue"><span>Talk, family, emergency — and one for when someone calls.</span></div><div id="cap10" class="capcue"><span>Someone is calling? Tap what they are asking you to do.</span></div><div id="cap11" class="capcue"><span>Two yes-or-no questions. No typing.</span></div><div id="cap12" class="capcue"><span>A bubble stays on screen, even in other apps.</span></div><div id="cap13" class="capcue"><span>Only when risk is high, a red strip appears.</span></div><div id="cap14" class="capcue"><span>Tap once to check what you are looking at.</span></div><div id="cap15" class="capcue"><span>Your phone asks you to confirm. One picture, never saved.</span></div><div id="cap16" class="capcue"><span>If a code arrives during a call, Khoan Đã warns you: do not read it out.</span></div><div id="cap17" class="capcue"><span>No time to tap? Face down for 1.3 seconds, or shake three times.</span></div><div id="cap18" class="capcue"><span>The rescue screen opens. You choose who to call.</span></div><div id="cap19" class="capcue"><span>One: split the message and understand it —</span></div><div id="cap20" class="capcue"><span>who is speaking, and what is being negated.</span></div><div id="cap21" class="capcue"><span>Two: plain pattern rules — they run even with no AI.</span></div><div id="cap22" class="capcue"><span>Three: AI reads, and only raises flags.</span></div><div id="cap23" class="capcue"><span>Each flag carries a quote as evidence.</span></div><div id="cap24" class="capcue"><span>Four: every quote must match the message — or the flag is dropped.</span></div><div id="cap25" class="capcue"><span>Five: fixed rules decide.</span></div><div id="cap26" class="capcue"><span>Fifty-eight signals. Ten critical combinations.</span></div><div id="cap27" class="capcue"><span>Six: if the input cannot be read, it is never treated as fine.</span></div><div id="cap28" class="capcue"><span>Seven: the verdict. High risk. Hang up now.</span></div><div id="cap29" class="capcue"><span>If fear takes over: pause sixty seconds, and say:</span></div><div id="cap30" class="capcue"><span>“Let me ask my family, and call you back.”</span></div><div id="cap31" class="capcue"><span>Three labels only. High risk. Suspicious. No clear risk signals found.</span></div><div id="cap32" class="capcue"><span>Never a fourth.</span></div><div id="cap33" class="capcue"><span>Family, one tap away. Official bank numbers, with sources.</span></div><div id="cap34" class="capcue"><span>We expect more people to pause before they transfer,</span></div><div id="cap35" class="capcue"><span>to be measured in a pilot with older adults.</span></div><div id="cap36" class="capcue"><span>That protects savings, wellbeing, inclusion, and trust.</span></div><div id="cap37" class="capcue"><span>571 messages, all written by us.</span></div><div id="cap38" class="capcue"><span>No real victim messages yet. That is our next step.</span></div><div id="cap39" class="capcue"><span>Khoan Đã. Pause. Verify. Protect.</span></div>
