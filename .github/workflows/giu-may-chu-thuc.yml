# GIỮ MÁY CHỦ KHỎI NGỦ — trong mùa nộp bài và chấm giải.
#
# ══════════ VÌ SAO CÓ TỆP NÀY ══════════
#
# Đo ngày 6/9/2026 trên https://khoan-da.onrender.com:
#
#     lần 1: 21,4 giây     ← máy chủ đang ngủ, Render dựng lại container
#     lần 2:  0,3 giây
#     lần 3:  0,7 giây
#
# Gói free của Render cho máy chủ ngủ sau khoảng 15 phút không ai truy cập.
# Người chấm giải bấm vào link, nhìn màn hình trắng 21 giây, và nhiều người sẽ
# đóng tab trước khi trang kịp hiện.
#
# ⚠️ LỖI KHÔNG NẰM Ở APP. Đã đo: toàn bộ module của máy chủ nạp trong 34ms.
# 21 giây là thời gian Render dựng lại container, và KHÔNG sửa được bằng mã.
#
# ══════════ ĐÁNH ĐỔI, NÓI THẲNG ══════════
#
# Đây là cách VÁ, không phải cách đúng. Nó giữ một máy chủ gói miễn phí ở trạng
# thái thức bằng cách gọi vào nó mỗi 10 phút — tức là dùng tài nguyên miễn phí
# theo cách nhà cung cấp không có ý định.
#
# Hai cách đúng hơn, cả hai đều cần bác quyết:
#   1. Trả tiền gói Render thấp nhất — máy chủ không ngủ, hết chuyện.
#   2. Tách phần giao diện tĩnh sang một nơi luôn thức (GitHub Pages,
#      Cloudflare Pages — đều miễn phí và không ngủ), chỉ để API gọi về Render.
#      Người vào thấy giao diện ngay; chỉ lần PHÂN TÍCH đầu tiên là chậm.
#      Đây là kiến trúc đúng, nhưng đổi nó vài ngày trước hạn nộp là rủi ro.
#
# ⚠️ TẮT TỆP NÀY KHI CHẤM XONG. Nó tồn tại cho một mùa cụ thể, không phải mãi
# mãi. Tắt bằng cách xoá tệp, hoặc vào tab Actions của kho và Disable workflow.

name: Giữ máy chủ thức

on:
  schedule:
    # Mỗi 10 phút. Render cho ngủ sau ~15 phút, nên 10 là có biên an toàn.
    # GitHub hay chạy trễ vài phút vào giờ cao điểm — đó là lý do không để 14.
    - cron: '*/10 * * * *'
  # Bấm tay được, để thử ngay mà không phải chờ tới nhịp kế tiếp.
  workflow_dispatch:

# Không cần đọc hay ghi gì trong kho. Cho quyền tối thiểu.
permissions: {}

jobs:
  danh-thuc:
    runs-on: ubuntu-latest
    # Máy chủ ngủ dậy mất ~21 giây; 90 giây là thừa sức, mà vẫn không treo.
    timeout-minutes: 3
    steps:
      - name: Gọi vào trang chủ
        run: |
          # `|| true` — máy chủ chưa dậy kịp thì lần sau gọi tiếp. Một lượt hỏng
          # KHÔNG được biến thành một email báo lỗi cho chủ kho mỗi 10 phút.
          ma=$(curl -sS -o /dev/null -w '%{http_code}' \
                 --max-time 90 \
                 https://khoan-da.onrender.com/ || true)
          echo "HTTP $ma"
